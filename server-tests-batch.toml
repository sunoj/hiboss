[[tasks]]
agent = "codex"
prompt = """
In the hiboss project at /Users/mingsun/Develop/ai/hiboss/server/, write integration tests for the webhook routes.

Create file: server/src/routes/webhooks.test.ts

Test the following endpoints using the existing test infrastructure:
- Import { env, SELF } from 'cloudflare:test' and { seedDatabase, authHeaders, getTestAgentId } from '../test-helpers'
- Call seedDatabase() in beforeAll

POST /api/webhooks/telegram:
- Receives a telegram message payload and creates a boss_to_agent message
- Returns 400 for missing chat or body
- Returns 404 for unknown chat_id (no agent configured)
- Ignores bot messages (from.is_bot = true)
- Handles callback_query for inline keyboard button presses

POST /api/webhooks/discord:
- Receives a discord message payload and creates a boss_to_agent message
- Returns 400 for missing channel or body
- Returns 404 for unknown channel_id
- Ignores bot messages (author.bot = true)

IMPORTANT: Before testing webhooks, you must insert channel_configs rows so the webhook can find the agent.
For telegram: INSERT INTO channel_configs with channel='telegram' and config='{"chat_id":"test-chat","bot_token":"fake-token"}'
For discord: INSERT INTO channel_configs with channel='discord' and config='{"channel_id":"test-discord-ch","bot_token":"fake-token"}'
Use agent_id from getTestAgentId().

Webhook requests don't need auth headers (they come from Telegram/Discord).

Follow the pattern in server/src/routes/messages.test.ts for structure. Use vitest globals (describe, it, expect, beforeAll).
"""
dir = "."
verify = "cd server && npx vitest run src/routes/webhooks.test.ts"

