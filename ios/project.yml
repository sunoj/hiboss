name: HiBoss
options:
  bundleIdPrefix: ai.hiboss
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

configs:
  Debug: debug
  Release: release
  AdHoc: release

packages:
  HibossKit:
    path: ../HibossKit

settings:
  base:
    MARKETING_VERSION: "0.2.3"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: JHH9GC8Y8C
  configs:
    Debug:
      APS_ENVIRONMENT: development
      CODE_SIGNING_ALLOWED: NO
    Release:
      APS_ENVIRONMENT: production
      CODE_SIGNING_ALLOWED: YES
    AdHoc:
      APS_ENVIRONMENT: production
      CODE_SIGNING_ALLOWED: YES

targets:
  HiBoss:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: HibossKit
      - target: HiBossWidgets
    scheme:
      testTargets:
        - HiBossTests
        - HiBossUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hiboss.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/HiBoss.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Ming Sun (JHH9GC8Y8C)"
          PROVISIONING_PROFILE_SPECIFIER: "HiBoss iOS AppStore"
        AdHoc:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Ming Sun (JHH9GC8Y8C)"
          PROVISIONING_PROFILE_SPECIFIER: "HiBoss iOS AdHoc"

  HiBossWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: HibossKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hiboss.app.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Ming Sun (JHH9GC8Y8C)"
          PROVISIONING_PROFILE_SPECIFIER: "HiBoss Widgets AppStore"
        AdHoc:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Ming Sun (JHH9GC8Y8C)"
          PROVISIONING_PROFILE_SPECIFIER: "HiBoss Widgets AdHoc"

  HiBossTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: HiBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hiboss.app.tests
        GENERATE_INFOPLIST_FILE: YES

  HiBossUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: HiBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hiboss.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HiBoss
