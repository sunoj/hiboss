prompt = """
Add an `edit_message` MCP tool to let agents update the body of messages they sent.

## Step 1: Server — extend PATCH /api/messages/:id

File: server/src/routes/messages.ts (around line 374)

The existing PATCH handler only accepts `status`. Extend it to also accept an optional `body` field:

```typescript
routes.patch('/:id', async (c) => {
  const agentId = getAgentId(c);
  const payload = await c.req.json<Record<string, unknown>>();
  const body = typeof payload.body === 'string' ? payload.body.trim() : undefined;
  const status = validateOption<Status>(payload.status, ['sent', 'delivered', 'read', 'replied', 'expired']);
  if (!status && !body) {
    return c.text('status or body is required', 400);
  }
  // ... existing fetch + ownership check ...
  // Build dynamic update
  const updates: string[] = ["updated_at = datetime('now')"];
  const binds: unknown[] = [];
  if (status) {
    // existing status transition validation
    const allowed = VALID_TRANSITIONS[existing.status];
    if (!allowed || !allowed.includes(status)) {
      return c.text(`invalid status transition`, 400);
    }
    updates.push('status = ?');
    binds.push(status);
  }
  if (body) {
    updates.push('body = ?');
    binds.push(body);
  }
  binds.push(existing.id);
  // ... execute update + return ...
});
```

Key rules:
- body edit is only allowed if `existing.agent_id === agentId` (already checked)
- body must be non-empty string
- status and body can be updated together or separately
- Keep existing status transition validation

## Step 2: Server test

Add a test in server/src/routes/messages.test.ts for the new body edit:
1. PATCH /:id with `{ body: "updated text" }` returns 200 with updated body
2. PATCH /:id with `{}` (no status, no body) returns 400
3. PATCH /:id with both `{ status: "read", body: "new" }` works

## Step 3: MCP — add edit_message tool

File: mcp/server.ts

1. Add tool definition after existing tools (around line 34):
```typescript
tool('edit_message', 'Edit the body of a previously sent message.', { message_id: field('string'), body: field('string') }, ['message_id', 'body']),
```

2. Add handler in callTool (around line 80):
```typescript
if (name === 'edit_message') return editMessageTool(args);
```

3. Add implementation:
```typescript
async function editMessageTool(args: Record<string, unknown>): Promise<CallToolResult> {
  const id = str(args.message_id, 'message_id');
  const message = await api('PATCH', `/api/messages/${encodeURIComponent(id)}`, { body: str(args.body, 'body') }) as Message;
  return ok(`Updated ${message.id}.`);
}
```

