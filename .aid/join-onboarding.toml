Create the server-side "join" feature for easy new-device onboarding. This involves 4 files.

## 1. Create: server/migrations/0018_join_requests.sql

```sql
-- Join requests for new device onboarding.
-- New devices POST /api/join, get a poll_token, and wait for boss approval.

CREATE TABLE IF NOT EXISTS join_requests (
  id TEXT PRIMARY KEY DEFAULT (lower(hex(randomblob(16)))),
  name TEXT NOT NULL,
  poll_token TEXT NOT NULL UNIQUE,
  status TEXT NOT NULL DEFAULT 'pending' CHECK (status IN ('pending', 'approved', 'rejected')),
  api_key_id TEXT REFERENCES api_keys(id),
  api_key TEXT,
  created_at TEXT NOT NULL DEFAULT (datetime('now')),
  updated_at TEXT NOT NULL DEFAULT (datetime('now'))
);
CREATE INDEX IF NOT EXISTS idx_join_requests_token ON join_requests(poll_token);
CREATE INDEX IF NOT EXISTS idx_join_requests_status ON join_requests(status, created_at DESC);
```

## 2. Create: server/src/routes/join.ts

Hono router with TWO endpoints. NO auth required (these are the onboarding path).

### POST / (mounted at /api/join)
- Body: `{ name?: string }` — name defaults to "new-agent" if not provided
- Generate poll_token: `jt_${generateHex(16)}` (same generateHex pattern as bootstrap.ts)
- Check if ANY api_keys exist: `SELECT COUNT(*) AS cnt FROM api_keys`
  - If cnt === 0 (first device ever): AUTO-APPROVE
    - Create api_key: generate `hb_${generateHex(16)}`, hash with `hashApiKey`, INSERT INTO api_keys
    - Create join_request with status='approved', api_key_id, api_key (the raw key)
    - Return 201: `{ request_id: id, poll_token, status: "approved", key, agent_id }`
  - If cnt > 0 (existing setup): create join_request with status='pending'
    - Send channel notifications (see below)
    - Return 201: `{ request_id: id, poll_token, status: "pending" }`
- Log audit: action='join.request'

Channel notification logic (when pending):
1. Query ALL enabled channel configs: `SELECT DISTINCT channel, config FROM channel_configs WHERE enabled = 1`
2. Deduplicate by (channel, chat_id) for telegram or (channel, channel_id/webhook_url) for discord
3. For each unique channel config:
   - Telegram: use `sendTelegramMessage(tgConfig, message, { inlineKeyboard })` from channels/telegram.ts
     - Message: `"🆕 <b>New device wants to join</b>\nName: ${escapeHtml(name)}\nRequest: ${id.slice(0, 8)}"`
     - inlineKeyboard: `[[{text: "✅ Approve", callback_data: "join:approve:" + id}, {text: "❌ Reject", callback_data: "join:reject:" + id}]]`
   - Discord: use `sendDiscordMessage(dcConfig, message, { components })` from channels/discord.ts
     - Message: `"🆕 **New device wants to join**\nName: ${name}\nRequest: ${id.slice(0, 8)}"`
     - components: Discord button components (type:1 action row with type:2 buttons, style:3 for approve/style:4 for reject, custom_id same as callback_data)
4. Wrap in try/catch — notification failures should NOT fail the join request

### GET /status (mounted at /api/join/status)
- Query param: `?token=<poll_token>`
- If no token: return 400 "token is required"
- Look up: `SELECT * FROM join_requests WHERE poll_token = ?`
- If not found: return 404 "not found"
- Return: `{ status, name, request_id: id, key?: api_key, agent_id?: api_key_id }`
  - Only include key and agent_id if status is 'approved' and api_key is not null
  - After returning approved status WITH key: clear the key (one-time retrieval):
    `UPDATE join_requests SET api_key = NULL, updated_at = datetime('now') WHERE id = ?`

## 3. Modify: server/src/routes/webhooks.ts

In the `handleCallbackQuery` function, add a check at the VERY TOP (line ~189, before `const data = asString(query['data'])`... actually right AFTER the data extraction but BEFORE the configRow lookup for message handling):

After the line `if (!data || !chatId) return c.text('invalid callback', 400);` add:

