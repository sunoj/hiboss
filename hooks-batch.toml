Implementation:

1. `session_start`: Run `hiboss inbox --count` by executing self as child process. If count > 0, run `hiboss inbox` and print results. Always exit 0. Catch all errors silently.

Actually, DON'T shell out to self. Instead, accept an optional --server and --key flag OR read the config file directly. The simplest approach: just read ~/.config/hiboss/config.json and use reqwest to make HTTP calls inline.

But actually the SIMPLEST approach that works: use std::process::Command to run `hiboss inbox --count` and `hiboss inbox` as child processes. This reuses existing CLI logic without duplication. The hook subcommand is just an orchestrator.

session_start:
```rust
fn run_session_start() {
    let count = get_inbox_count();
    if count > 0 {
        println!("You have {} unread boss messages:", count);
        // Run hiboss inbox and print its stdout
        let output = std::process::Command::new("hiboss").args(["inbox"]).output();
        if let Ok(out) = output {
            print!("{}", String::from_utf8_lossy(&out.stdout));
        }
        println!("Handle these messages before starting other work. Use 'hiboss reply <id> \"response\"' to reply.");
    }
}
```

post_tool_use (with TTL):
```rust
fn run_post_tool_use() {
    let ttl_file = "/tmp/hiboss-urgent-check";
    let ttl_seconds: u64 = 300;

    // Check TTL
    if let Ok(content) = fs::read_to_string(ttl_file) {
        if let Ok(last_check) = content.trim().parse::<u64>() {
            let now = SystemTime::now().duration_since(UNIX_EPOCH).unwrap_or_default().as_secs();
            if now - last_check < ttl_seconds {
                return; // Skip, checked recently
            }
        }
    }

    // Write TTL early to prevent retry storms
    let now = SystemTime::now().duration_since(UNIX_EPOCH).unwrap_or_default().as_secs();
    let _ = fs::write(ttl_file, now.to_string());

    // Check urgent messages
    let count = get_priority_inbox_count("critical,high");
    if count > 0 {
        println!("URGENT: You have {} unread critical/high priority boss messages. Run: hiboss inbox --priority critical,high", count);
    }
}
```

stop:
```rust
fn run_stop() {
    let count = get_inbox_count();
    if count > 0 {
        println!("You have {} unread boss messages. Run 'hiboss inbox' and handle them before finishing.", count);
    } else {
        println!("[hiboss] No unread boss messages.");
    }
}
```

Helper:
```rust
fn get_inbox_count() -> u32 {
    let output = std::process::Command::new("hiboss")
        .args(["inbox", "--count"])
        .output()
        .ok();
    output.and_then(|o| String::from_utf8_lossy(&o.stdout).trim().parse().ok()).unwrap_or(0)
}

fn get_priority_inbox_count(priority: &str) -> u32 {
    let output = std::process::Command::new("hiboss")
        .args(["inbox", "--priority", priority, "--count"])
        .output()
        .ok();
    output.and_then(|o| String::from_utf8_lossy(&o.stdout).trim().parse().ok()).unwrap_or(0)
}
```

