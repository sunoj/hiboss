```

Add a new function `handleJoinCallback`:
```typescript
async function handleJoinCallback(
  c: Context<{ Bindings: Env }>,
  query: Record<string, unknown>,
  data: string,
  chatId: string
): Promise<Response> {
  const queryId = asString(query['id']);
  // Get bot token from any telegram config for this chat
  const configRow = await c.env.DB
    .prepare("SELECT config FROM channel_configs WHERE channel = 'telegram' AND enabled = 1 AND json_extract(config, '$.chat_id') = ? LIMIT 1")
    .bind(chatId)
    .first<{ config: string }>();
  const botToken = configRow ? (JSON.parse(configRow.config) as Record<string, string>).bot_token : undefined;
  const answer = (text: string) => {
    if (botToken && queryId) c.executionCtx.waitUntil(answerCallbackQuery(botToken, queryId, text));
  };

  // Parse: join:approve:requestId or join:reject:requestId
  const parts = data.split(':');
  if (parts.length !== 3) { answer('Invalid'); return c.text('invalid join callback', 400); }
  const action = parts[1]; // 'approve' or 'reject'
  const requestId = parts[2];

  const request = await c.env.DB
    .prepare("SELECT * FROM join_requests WHERE id = ? AND status = 'pending'")
    .bind(requestId)
    .first<{ id: string; name: string; status: string }>();
  if (!request) {
    answer('Request not found or already processed');
    return c.text('not found', 404);
  }

  if (action === 'approve') {
    // Create api_key
    const key = `hb_${generateHex(16)}`;
    const keyHash = await hashApiKey(key);
    const inserted = await c.env.DB
      .prepare('INSERT INTO api_keys (name, key_hash) VALUES (?, ?) RETURNING id')
      .bind(request.name, keyHash)
      .first<{ id: string }>();
    if (!inserted) { answer('Error'); return c.text('failed', 500); }
    // Update join request
    await c.env.DB
      .prepare("UPDATE join_requests SET status = 'approved', api_key_id = ?, api_key = ?, updated_at = datetime('now') WHERE id = ?")
      .bind(inserted.id, key, requestId)
      .run();
    answer('✅ Approved');
    // Edit original message
    const chatMsg = query['message'] as Record<string, unknown> | undefined;
    const msgId = chatMsg?.['message_id'] as number | undefined;
    if (botToken && msgId) {
      c.executionCtx.waitUntil(editMessageReplyMarkup(botToken, chatId, msgId, `✅ Approved: ${request.name}`));
    }
    c.executionCtx.waitUntil(logAudit(c.env, 'system', 'telegram', 'join.approve', 'join_request', requestId, request.name));
    return c.json({ ok: true, status: 'approved' });
  }

  if (action === 'reject') {
    await c.env.DB
      .prepare("UPDATE join_requests SET status = 'rejected', updated_at = datetime('now') WHERE id = ?")
      .bind(requestId)
      .run();
    answer('❌ Rejected');
    const chatMsg = query['message'] as Record<string, unknown> | undefined;
    const msgId = chatMsg?.['message_id'] as number | undefined;
    if (botToken && msgId) {
      c.executionCtx.waitUntil(editMessageReplyMarkup(botToken, chatId, msgId, `❌ Rejected: ${request.name}`));
    }
    c.executionCtx.waitUntil(logAudit(c.env, 'system', 'telegram', 'join.reject', 'join_request', requestId, request.name));
    return c.json({ ok: true, status: 'rejected' });
  }

  answer('Unknown action');
  return c.text('unknown action', 400);
}
```

IMPORTANT: You need to import `hashApiKey` and `editMessageReplyMarkup` and `answerCallbackQuery` and `logAudit` — check existing imports in the file and add what's missing. The `generateHex` function should be added locally (same pattern as bootstrap.ts) or imported.

