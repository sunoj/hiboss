[package]
name = "hiboss"
version = "1.5.0"
edition = "2024"
description = "CLI for AI agents to communicate with their boss"
license = "MIT"
repository = "https://github.com/sunoj/hiboss"
homepage = "https://github.com/sunoj/hiboss"
keywords = ["cli", "ai", "agent", "communication", "bot"]
categories = ["command-line-utilities"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "io-util"] }
dirs = "6"
colored = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
