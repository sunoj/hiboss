      const params = new URLSearchParams(window.location.search);
      const urlKey = params.get('key');
      const storedKey = localStorage.getItem('hiboss_key') || '';
      const storedMode = localStorage.getItem('hiboss_auth_mode') || 'agent';
      const key = urlKey || storedKey;
      if (urlKey) {
        history.replaceState(null, '', window.location.pathname);
      }
      if (!key) return;
      draftKey.value = key;
      loginBusy.value = true;
      try {
        await bootstrapFromKey(key, storedMode);
      } catch {
        apiKey.value = '';
        authReady.value = false;
        localStorage.removeItem('hiboss_key');
        localStorage.removeItem('hiboss_auth_mode');
      } finally {
        loginBusy.value = false;
      }
    }
    async function loadMessages(quiet) {
      messages.loading = true;
      messages.quiet = Boolean(quiet);
      const params = new URLSearchParams({ limit: String(messages.limit), offset: String(messages.offset) });
      if (messages.filters.direction) params.set('direction', messages.filters.direction);
      if (messages.filters.status) params.set('status', messages.filters.status);
      if (messages.filters.priority) params.set('priority', messages.filters.priority);
      if (messages.filters.session) params.set('session', messages.filters.session);
      if (messages.filters.search) params.set('search', messages.filters.search);
      const endpoint = authMode.value === 'boss' ? '/api/boss/messages?' : '/api/messages?';
      try {
        const data = await apiFetch(endpoint + params.toString());
        messages.items = data.messages || [];
        messages.total = data.total || 0;
        if (messages.expandedId && !messages.items.some(item => item.id === messages.expandedId)) {
          messages.expandedId = null;
        }
        if (messages.expandedId) await loadMessageDetail(messages.expandedId, true);
      } catch (error) {
        if (!quiet) toast('Failed to load messages', 'error');
      } finally {
        messages.loading = false;
      }
    }
    async function loadMessageDetail(id, silent) {
      messages.detailLoading[id] = true;
      const endpoint = authMode.value === 'boss' ? '/api/boss/messages/' : '/api/messages/';
      try {
        messages.details[id] = await apiFetch(endpoint + id);
      } catch {
        delete messages.details[id];
        if (!silent) toast('Failed to load message detail', 'error');
      } finally {
        messages.detailLoading[id] = false;
      }
    }
    async function toggleMessage(id) {
      messages.expandedId = messages.expandedId === id ? null : id;
      if (messages.expandedId) await loadMessageDetail(id, false);
    }
    function toggleForwardMenu(id) {
      messages.forwardMenuId = messages.forwardMenuId === id ? '' : id;
    }
    function setMessageFilter(key, value) {
      messages.filters[key] = value;
      messages.offset = 0;
      loadMessages(false);
    }
    function setMessageSearch(value) {
      messages.filters.search = String(value || '').trim();
      messages.offset = 0;
      loadMessages(false);
    }
    function paginateMessages(dir) {
      messages.offset = Math.max(0, messages.offset + dir * messages.limit);
      messages.expandedId = null;
      loadMessages(false);
    }
    function refreshMessagesFromPull() {
      if (messages.loading) return;
      loadMessages(false);
    }
    function updateMessageReply(kind, id, value) {
      if (kind === 'draft') {
        messages.replyDrafts[id] = value;
        return;
      }
      sendMessageReply(id, messages.replyDrafts[id] || '');
    }
    async function sendMessageReply(id, body) {
      const trimmed = String(body || '').trim();
      if (!trimmed || messages.sendingReplyId) return;
      messages.sendingReplyId = id;
      try {
        const endpoint = authMode.value === 'boss' ? '/api/boss/messages/' + id + '/reply' : '/api/messages/' + id + '/reply';
        await apiFetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body: trimmed })
        });
        messages.replyDrafts[id] = '';
        await loadMessageDetail(id, true);
        await loadMessages(true);
        toast('Reply sent', 'success');
      } catch (error) {
        toast('Failed to send reply', 'error');
      } finally {
        messages.sendingReplyId = '';
      }
    }
    function handleMessageReplyKeydown(event, id) {
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
        event.preventDefault();
        sendMessageReply(id, messages.replyDrafts[id] || '');
      }
    }
    async function sendOptionReply(id, option) {
      if (messages.optionSendingId) return;
      messages.optionSendingId = id;
      try {
        await apiFetch('/api/boss/messages/' + id + '/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body: option })
        });
        await loadMessageDetail(id, true);
        await loadMessages(true);
        toast('Option sent', 'success');
      } catch {
        toast('Failed to send option', 'error');
      } finally {
        messages.optionSendingId = '';
      }
    }
    async function sendMessageForward(id, channel) {
      const targetChannel = String(channel || '').trim();
      if (!targetChannel || messages.sendingForwardId) return;
      messages.sendingForwardId = id;
      try {
        await apiFetch('/api/boss/messages/' + id + '/forward', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ channel: targetChannel })
        });
        messages.forwardMenuId = '';
        await loadMessages(true);
        toast('Message forwarded', 'success');
      } catch {
        toast('Failed to forward message', 'error');
      } finally {
        messages.sendingForwardId = '';
      }
    }
    function normalizeSessionItem(item) {
      return { ...item, status: item.status || 'working', stale: isStale(item.last_seen_at) };
    }
    function rebuildSessionColumns(items) {
      sessions.byColumn = { working: [], blocked: [], waiting: [], idle: [], completed: [] };
      for (const item of items) {
        const bucket = sessions.byColumn[item.status] || sessions.byColumn.working;
        bucket.push(item);
      }
    }
    async function loadSessions(quiet) {
      sessions.loading = true;
      sessions.quiet = Boolean(quiet);
      try {
        const endpoint = authMode.value === 'boss' ? '/api/boss/sessions' : '/api/sessions?all=true';
        const data = await apiFetch(endpoint);
        sessions.items = (data.sessions || []).map(normalizeSessionItem);
        sessions.filtered = sessions.showCompleted ? sessions.items : sessions.items.filter(item => item.status !== 'completed');
        rebuildSessionColumns(sessions.filtered);
        if (sessions.expandedId && !sessions.filtered.some(item => item.id === sessions.expandedId)) {
          sessions.expandedId = null;
        }
        if (sessions.expandedId) await loadSessionDetail(sessions.expandedId, true);
      } catch {
        if (!quiet) toast('Failed to load sessions', 'error');
      } finally {
        sessions.loading = false;
      }
    }
    async function toggleSession(id) {
      sessions.expandedId = sessions.expandedId === id ? null : id;
      if (sessions.expandedId) await loadSessionDetail(id, false);
    }
    async function loadSessionDetail(id, silent) {
      sessions.detailLoading[id] = true;
      try {
        const params = new URLSearchParams({ session: id, limit: '20' });
        const endpoint = authMode.value === 'boss' ? '/api/boss/messages?' : '/api/messages?';
        const data = await apiFetch(endpoint + params.toString());
        sessions.details[id] = data.messages || [];
      } catch {
        sessions.details[id] = [];
        if (!silent) toast('Failed to load session detail', 'error');
      } finally {
        sessions.detailLoading[id] = false;
      }
    }
    function setSessionDraft(sessionId, value) {
      sessions.sessionDrafts[sessionId] = value;
    }
    async function sendToSession(sessionId) {
      const body = String(sessions.sessionDrafts[sessionId] || '').trim();
      if (!body || sessions.sendingSessionId) return;
      sessions.sendingSessionId = sessionId;
      try {
        const params = new URLSearchParams({ session: sessionId, limit: '1', direction: 'agent_to_boss' });
        const data = await apiFetch('/api/boss/messages?' + params.toString());
        const target = (data.messages || [])[0];
        if (!target) throw new Error('No reply target');
        await apiFetch('/api/boss/messages/' + target.id + '/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body })
        });
        sessions.sessionDrafts[sessionId] = '';
        await loadSessionDetail(sessionId, true);
        await loadSessions(true);
        toast('Session message sent', 'success');
      } catch {
        toast('Failed to send session message', 'error');
      } finally {
        sessions.sendingSessionId = '';
      }
    }
    function setSessionReplyDraft(messageId, value) {
      sessions.replyDrafts[messageId] = value;
    }
    async function sendSessionReply(sessionId, messageId) {
      const body = String(sessions.replyDrafts[messageId] || '').trim();
      if (!body || sessions.sendingReplyId) return;
      sessions.sendingReplyId = messageId;
      try {
        await apiFetch('/api/boss/messages/' + messageId + '/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body })
        });
        sessions.replyDrafts[messageId] = '';
        await loadSessionDetail(sessionId, true);
        await loadMessages(true);
        toast('Reply sent', 'success');
      } catch {
        toast('Failed to send session reply', 'error');
      } finally {
        sessions.sendingReplyId = '';
      }
    }
    function handleSessionReplyKeydown(event, sessionId, messageId) {
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
        event.preventDefault();
        sendSessionReply(sessionId, messageId);
      }
    }
    async function loadAgents(quiet) {
      agents.loading = true;
      agents.quiet = Boolean(quiet);
      try {
        const endpoint = authMode.value === 'boss' ? '/api/boss/agents' : '/api/agents';
        const data = await apiFetch(endpoint);
        agents.items = data.agents || [];
        if (!agents.selfId && authMode.value === 'agent') {
          const me = await loadMe();
          agents.selfId = me.id;
        }
        if (agents.expandedId === agents.selfId) {
          await loadAgentEditDraft();
        }
      } catch {
        if (!quiet) toast('Failed to load agents', 'error');
      } finally {
        agents.loading = false;
      }
    }
    async function loadAgentEditDraft() {
      try {
        const me = await apiFetch('/api/agents/me');
        agents.selfId = me.id;
        agents.editDraft = {
          default_priority: me.default_priority || 'normal',
          rate_limit: me.rate_limit ?? '',
          role: me.role || '',
          avatar_url: me.avatar_url || '',
          channel_routing: { ...(me.channel_routing || {}) }
        };
      } catch {
        agents.editDraft = null;
      }
    }
    async function toggleAgent(id) {
      agents.expandedId = agents.expandedId === id ? null : id;
      if (agents.expandedId === agents.selfId) {
        await loadAgentEditDraft();
      }
    }
    function updateAgentDraft(path, value) {
      if (!agents.editDraft) return;
      if (path.startsWith('channel_routing.')) {
        const key = path.split('.')[1];
        const next = { ...(agents.editDraft.channel_routing || {}) };
        if (value) next[key] = value;
        else delete next[key];
        agents.editDraft.channel_routing = next;
        return;
      }
      agents.editDraft[path] = value;
    }
    async function saveAgentConfig() {
      if (!agents.editDraft || agents.saving) return;
      agents.saving = true;
      try {
        const rateLimitRaw = String(agents.editDraft.rate_limit).trim();
        const payload = {
          default_priority: agents.editDraft.default_priority || 'normal',
          rate_limit: !rateLimitRaw || rateLimitRaw === '0' ? null : Number(rateLimitRaw),
          role: agents.editDraft.role || null,
          avatar_url: agents.editDraft.avatar_url ? String(agents.editDraft.avatar_url).trim() || null : null,
          channel_routing: Object.keys(agents.editDraft.channel_routing || {}).length ? agents.editDraft.channel_routing : null
        };
        await apiFetch('/api/agents/me/config', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        toast('Config saved', 'success');
        await loadAgents(true);
      } catch {
        toast('Failed to save config', 'error');
      } finally {
        agents.saving = false;
      }
    }
    async function loadSettings() {
      settings.loading = true;
      try {
        const [me, prefs] = await Promise.all([
          apiFetch('/api/boss/me'),
          apiFetch('/api/boss/me/preferences')
        ]);
        settings.me = me || {};
        settings.draft = {
          preferred_channel: prefs.preferred_channel || '',
          timezone: prefs.timezone || '',
          quiet_hours: {
            start: (prefs.quiet_hours && prefs.quiet_hours.start) || '',
            end: (prefs.quiet_hours && prefs.quiet_hours.end) || ''
          },
          notify_priorities: Array.isArray(prefs.notify_priorities) ? prefs.notify_priorities.slice() : []
        };
      } catch {
        toast('Failed to load settings', 'error');
      } finally {
        settings.loading = false;
      }
    }
    function updateSettingsField(field, value) {
      if (field === 'quiet_start') settings.draft.quiet_hours.start = value;
      else if (field === 'quiet_end') settings.draft.quiet_hours.end = value;
      else settings.draft[field] = value;
    }
    function toggleNotifyPriority(priority, checked) {
      const next = new Set(settings.draft.notify_priorities);
      if (checked) next.add(priority);
      else next.delete(priority);
      settings.draft.notify_priorities = Array.from(next);
    }
    async function saveSettings() {
      if (settings.saving) return;
      settings.saving = true;
      try {
        const quiet = settings.draft.quiet_hours.start && settings.draft.quiet_hours.end
          ? { start: settings.draft.quiet_hours.start, end: settings.draft.quiet_hours.end }
          : null;
        const payload = {
          preferred_channel: settings.draft.preferred_channel || null,
          timezone: settings.draft.timezone || '',
          quiet_hours: quiet,
          notify_priorities: settings.draft.notify_priorities
        };
        await apiFetch('/api/boss/me/preferences', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        toast('Preferences saved', 'success');
      } catch {
        toast('Failed to save preferences', 'error');
      } finally {
        settings.saving = false;
      }
    }
    async function loadCurrentTab(quiet) {
      if (!authReady.value) return;
      quietRefreshing.value = Boolean(quiet);
      if (activeTab.value === 'messages') await loadMessages(quiet);
      else if (activeTab.value === 'sessions') await loadSessions(quiet);
      else if (activeTab.value === 'agents') await loadAgents(quiet);
      else if (activeTab.value === 'settings' && !quiet) await loadSettings();
      refreshTick.value = nowMs();
      quietRefreshing.value = false;
    }
    function stopRefresh() {
      if (refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
    }
    function startRefresh() {
      stopRefresh();
      refreshTimer = setInterval(() => {
        if (authReady.value && activeTab.value !== 'settings') {
          loadCurrentTab(true);
        }
      }, AUTO_REFRESH_MS);
    }
    function setShowCompleted(value) {
      sessions.showCompleted = value;
      loadSessions(false);
    }
    watch(activeTab, async () => {
      if (!authReady.value) return;
      if (activeTab.value === 'settings' && authMode.value !== 'boss') {
        activeTab.value = 'messages';
        return;
      }
      await loadCurrentTab(false);
    });
    function tabButtonClass(tab, mobile) {
      const active = activeTab.value === tab;
      if (mobile) {
        return active
          ? 'flex min-h-[52px] flex-col items-center justify-center gap-1 rounded-2xl bg-accent-soft px-3 py-2 text-xs font-medium text-accent ring-1 ring-accent/40'
          : 'flex min-h-[52px] flex-col items-center justify-center gap-1 rounded-2xl px-3 py-2 text-xs font-medium text-ink-muted transition hover:bg-surface-hover hover:text-ink';
      }
      return active
        ? 'inline-flex items-center gap-2 rounded-2xl px-4 py-3 text-sm transition bg-accent-soft text-accent ring-1 ring-accent/40'
        : 'inline-flex items-center gap-2 rounded-2xl px-4 py-3 text-sm transition text-ink-muted hover:bg-surface-hover hover:text-ink';
    }
    onMounted(async () => {
      document.documentElement.classList.add('dark');
      registerServiceWorker();
      await init();
      startRefresh();
    });
    onBeforeUnmount(() => stopRefresh());
    return {
      draftKey,
      loginError,
      loginBusy,
      authReady,
      authMode,
      authBadgeLabel,
      authBadgeClass,
      activeTab,
      navItems,
      meName,
      refreshEnabled,
      quietRefreshing,
      toasts,
      messages,
      sessions,
      agents,
      settings,
      prettyMetadata,
      submitLogin,
      logout,
      tabButtonClass,
      setMessageFilter,
      setMessageSearch,
      refreshMessagesFromPull,
      toggleMessage,
      toggleForwardMenu,
      paginateMessages,
      updateMessageReply,
      handleMessageReplyKeydown,
      sendOptionReply,
      sendMessageForward,
      toggleSession,
      setSessionDraft,
      sendToSession,
      setSessionReplyDraft,
      sendSessionReply,
      handleSessionReplyKeydown,
      toggleAgent,
      updateAgentDraft,
      saveAgentConfig,
      updateSettingsField,
      setShowCompleted,
      toggleNotifyPriority,
      saveSettings
    };
  },
  template: `
    <div>
      <LoginView
        v-if="!authReady"
        :draft-key="draftKey"
        :error="loginError"
        :busy="loginBusy"
        @update:key="draftKey = $event"
        @submit="submitLogin"
      />
      <div v-else class="min-h-screen">
        <header class="sticky top-0 z-30 border-b border-border bg-surface/95 backdrop-blur">
          <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-4 md:flex-row md:items-center md:justify-between">
            <div class="flex items-center gap-3">
              <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-accent-soft text-accent">
                <Icon name="spark" cls="h-5 w-5" />
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-sm font-semibold tracking-tight">hiboss</h1>
                  <span class="text-sm text-ink-muted">{{ meName }}</span>
                  <span :class="['inline-flex rounded-full px-2.5 py-1 text-[11px] font-semibold uppercase tracking-[0.18em]', authBadgeClass]">{{ authBadgeLabel }}</span>
                </div>
                <p class="text-xs text-ink-muted">Async comms dashboard</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span :class="['inline-flex items-center gap-2 rounded-full border border-border px-3 py-2 text-xs text-ink-muted', refreshEnabled ? 'text-green' : 'text-ink-faint']">
                <span :class="['h-2.5 w-2.5 rounded-full', refreshEnabled ? 'bg-green pulse-dot' : 'bg-ink-faint']"></span>
                {{ refreshEnabled ? 'Auto-refresh active' : 'Auto-refresh paused' }}
              </span>
              <button @click="logout" class="inline-flex items-center gap-2 rounded-full border border-border px-4 py-2 text-sm text-ink-muted transition hover:bg-surface-hover hover:text-ink">
                <Icon name="logout" cls="h-4 w-4" />
                <span>Sign out</span>
              </button>
            </div>
          </div>
          <div class="mx-auto max-w-7xl px-4">
            <nav class="hidden gap-2 overflow-x-auto pb-3 sm:flex">
              <button v-for="item in navItems" :key="item.key" @click="activeTab = item.key" :class="tabButtonClass(item.key, false)">
                <Icon :name="item.icon" cls="h-4 w-4" />
                <span>{{ item.label }}</span>
              </button>
            </nav>
          </div>
        </header>
        <main class="mx-auto max-w-7xl px-4 pb-28 pt-6 sm:pb-6">
          <MessagesTab
            v-if="activeTab === 'messages'"
            :state="messages"
            :auth-mode="authMode"
            :refreshing="refreshEnabled && quietRefreshing"
            @refresh="refreshMessagesFromPull"
            @filter="setMessageFilter"
            @search="setMessageSearch"
            @toggle="toggleMessage"
            @paginate="paginateMessages"
            @reply="updateMessageReply"
            @reply-keydown="handleMessageReplyKeydown"
            @option="sendOptionReply"
            @forward-toggle="toggleForwardMenu"
            @forward-send="sendMessageForward"
          />
          <SessionsTab
            v-else-if="activeTab === 'sessions'"
            :state="sessions"
            :auth-mode="authMode"
            :refreshing="refreshEnabled && quietRefreshing"
            @toggle-completed="setShowCompleted"
            @toggle-session="toggleSession"
            @session-draft="setSessionDraft"
            @session-send="sendToSession"
            @session-reply-draft="setSessionReplyDraft"
            @session-reply-send="sendSessionReply"
            @session-reply-keydown="handleSessionReplyKeydown"
          />
          <AgentsTab
            v-else-if="activeTab === 'agents'"
            :state="agents"
            :auth-mode="authMode"
            :refreshing="refreshEnabled && quietRefreshing"
            @toggle-agent="toggleAgent"
            @config-field="updateAgentDraft"
            @save-config="saveAgentConfig"
          />
          <SettingsTab
            v-else
            :state="settings"
            @field="updateSettingsField"
            @priority="toggleNotifyPriority"
            @save="saveSettings"
          />
        </main>
        <nav class="fixed inset-x-0 bottom-0 z-40 border-t border-border bg-surface/95 backdrop-blur sm:hidden">
          <div class="mx-auto grid max-w-7xl gap-2 px-4 pb-[calc(env(safe-area-inset-bottom)+0.75rem)] pt-2" :style="{ gridTemplateColumns: 'repeat(' + navItems.length + ', minmax(0, 1fr))' }">
            <button v-for="item in navItems" :key="item.key + '-mobile'" @click="activeTab = item.key" :class="tabButtonClass(item.key, true)">
              <Icon :name="item.icon" cls="h-4 w-4" />
              <span>{{ item.label }}</span>
            </button>
          </div>
        </nav>
      </div>
      <ToastStack :items="toasts" />
    </div>
  `
};
createApp(App).mount('#app');
</script>
</body>
</html>
