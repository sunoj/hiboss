This command modifies the project's `.claude/settings.json` to add hiboss hooks. It must handle existing user hooks gracefully.

```rust
use clap::Args;
use std::error::Error;

#[derive(Debug, Args)]
pub struct SetupArgs {
    #[command(subcommand)]
    pub command: SetupCommand,
}

#[derive(Debug, clap::Subcommand)]
pub enum SetupCommand {
    #[command(about = "Configure Claude Code hooks for hiboss")]
    Hooks(SetupHooksArgs),
}

#[derive(Debug, Args)]
pub struct SetupHooksArgs {
    #[arg(long, help = "Project directory (default: current dir)")]
    pub dir: Option<String>,
    #[arg(long, help = "Remove hiboss hooks instead of adding")]
    pub remove: bool,
}
```

Implementation of `run_setup_hooks`:

1. Determine the project dir (--dir flag or current working directory)
2. Read `<project_dir>/.claude/settings.json` if it exists, or start with empty `{}`
3. Parse as serde_json::Value
4. For each hook event (SessionStart, PostToolUse, Stop):
   - The hiboss hook command is: `hiboss hook session-start`, `hiboss hook post-tool-use`, `hiboss hook stop`
   - Navigate to hooks -> <EventName> (array of matcher objects)
   - Check if a hiboss hook already exists (command contains "hiboss hook")
   - If --remove: remove the hiboss hook entry, clean up empty arrays
   - If adding: append a new entry: `{"matcher": "", "hooks": [{"type": "command", "command": "hiboss hook <event-name>"}]}`
   - NEVER remove or modify existing non-hiboss hooks
5. Create `.claude/` directory if needed
6. Write back the JSON (pretty-printed with 2-space indent)
7. Print what was done:
   - "Added hiboss hooks to .claude/settings.json" or
   - "Removed hiboss hooks from .claude/settings.json" or
   - "hiboss hooks already configured in .claude/settings.json"

Use serde_json for JSON manipulation. The settings.json structure is:
```json
{
  "hooks": {
    "SessionStart": [
      {"matcher": "", "hooks": [{"type": "command", "command": "some-existing-hook"}]},
      {"matcher": "", "hooks": [{"type": "command", "command": "hiboss hook session-start"}]}
    ],
    "PostToolUse": [...],
    "Stop": [...]
  }
}
```

Each event key maps to an ARRAY of matcher objects. Each matcher has a "matcher" string and "hooks" array. We append a new matcher object for hiboss, we don't modify existing ones.

CRITICAL: Preserve existing hooks. Only add/remove hiboss-specific entries (commands containing "hiboss hook").
"""
