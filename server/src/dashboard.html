<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hiboss dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --bg-surface: #161b22;
  --bg-hover: #1c2129;
  --bg-input: #0d1117;
  --border: #30363d;
  --border-light: #21262d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --text-dim: #484f58;
  --accent: #58a6ff;
  --accent-dim: #1f6feb33;
  --green: #3fb950;
  --yellow: #d29922;
  --orange: #db6d28;
  --red: #f85149;
  --purple: #bc8cff;
  --blue: #58a6ff;
  --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --radius: 6px;
  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2rem;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}

/* Layout */
.app { display: flex; flex-direction: column; min-height: 100vh; }

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-sm) var(--space-lg);
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface);
  flex-shrink: 0;
}

header h1 { font-size: 0.875rem; font-weight: 600; letter-spacing: -0.01em; }
header h1 span { color: var(--text-muted); font-weight: 400; margin-left: var(--space-sm); }

.header-right { display: flex; align-items: center; gap: var(--space-md); }
.refresh-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.refresh-dot.paused { background: var(--text-dim); }
.btn-logout { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; }
.btn-logout:hover { color: var(--text); }

/* Tabs */
nav {
  display: flex; gap: 0; border-bottom: 1px solid var(--border);
  background: var(--bg-surface); padding: 0 var(--space-lg);
}

nav button {
  background: none; border: none; color: var(--text-muted);
  padding: var(--space-sm) var(--space-md);
  font-size: 0.8125rem; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
nav button:hover { color: var(--text); }
nav button.active { color: var(--text); border-bottom-color: var(--accent); }

/* Main content */
main { flex: 1; padding: var(--space-lg); max-width: 1400px; width: 100%; margin: 0 auto; }

/* Filter bar */
.filters {
  display: flex; flex-wrap: wrap; gap: var(--space-sm);
  margin-bottom: var(--space-md); align-items: center;
}

.filters select, .filters input {
  background: var(--bg-input); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0.3rem 0.5rem;
  font-size: 0.75rem; font-family: var(--sans);
}
.filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }

/* Table */
table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }

thead th {
  text-align: left; padding: var(--space-sm) var(--space-sm);
  color: var(--text-muted); font-weight: 500; font-size: 0.75rem;
  border-bottom: 1px solid var(--border); white-space: nowrap;
  text-transform: uppercase; letter-spacing: 0.03em;
}

tbody tr {
  border-bottom: 1px solid var(--border-light);
  cursor: pointer; transition: background 0.1s;
}
tbody tr:hover { background: var(--bg-hover); }

td {
  padding: var(--space-sm); vertical-align: top; max-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.col-id { font-family: var(--mono); font-size: 0.75rem; color: var(--text-muted); width: 6rem; }
.col-from { width: 8rem; }
.col-dir { width: 7rem; }
.col-priority { width: 5rem; }
.col-body { min-width: 200px; }
.col-status { width: 5rem; }
.col-time { width: 6rem; color: var(--text-muted); text-align: right; white-space: nowrap; }

/* Priority badges */
.badge {
  display: inline-block; padding: 0.1rem 0.4rem; border-radius: 3px;
  font-size: 0.6875rem; font-weight: 500; line-height: 1.4;
}
.badge-critical { background: #f8514922; color: var(--red); }
.badge-high { background: #db6d2822; color: var(--orange); }
.badge-normal { background: #30363d44; color: var(--text-muted); }
.badge-low { background: #30363d22; color: var(--text-dim); }

/* Status badges */
.badge-sent { color: var(--yellow); }
.badge-delivered { color: var(--blue); }
.badge-read { color: var(--green); }
.badge-replied { color: var(--purple); }

/* Direction label */
.dir-out { color: var(--accent); }
.dir-in { color: var(--green); }
.dir-agent { color: var(--purple); }

/* Agent status */
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.status-online { background: var(--green); }
.status-idle { background: var(--yellow); }
.status-offline { background: var(--text-dim); }

/* Session kanban board */
.kanban { display: flex; gap: var(--space-md); overflow-x: auto; padding-bottom: var(--space-md); }
.kanban-col { flex: 1; min-width: 200px; max-width: 300px; }
.kanban-header {
  display: flex; align-items: center; gap: var(--space-xs);
  font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.03em; padding: var(--space-sm); margin-bottom: var(--space-sm);
  border-bottom: 2px solid var(--border);
}
.kanban-header .count { color: var(--text-muted); font-weight: 400; }
.kanban-card {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: var(--space-sm); margin-bottom: var(--space-xs);
  font-size: 0.8125rem; transition: background 0.1s;
}
.kanban-card:hover { background: var(--bg-hover); }
.kanban-card .card-label { font-weight: 500; margin-bottom: 2px; }
.kanban-card .card-agent { font-size: 0.6875rem; color: var(--text-muted); }
.kanban-card .card-text { font-size: 0.6875rem; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kanban-card .card-time { font-size: 0.625rem; color: var(--text-dim); margin-top: 4px; }
.status-working { border-color: var(--green); }
.status-blocked { border-color: var(--red); }
.status-waiting { border-color: var(--yellow); }
.status-session-idle { border-color: var(--text-dim); }
.status-completed { border-color: var(--blue); }

@media (max-width: 768px) {
  .kanban { flex-direction: column; }
  .kanban-col { max-width: none; }
}

/* Expanded message detail */
.msg-detail {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: var(--space-md);
  margin: var(--space-sm) 0 var(--space-md);
  font-size: 0.8125rem; animation: fadeIn 0.15s ease;
}
.msg-detail pre {
  white-space: pre-wrap; word-break: break-word;
  font-family: var(--sans); color: var(--text); line-height: 1.6;
  margin: var(--space-sm) 0;
}
.msg-detail .meta-row { color: var(--text-muted); font-size: 0.75rem; margin-top: var(--space-sm); }
.msg-detail .meta-row span { margin-right: var(--space-md); }

.replies-section { margin-top: var(--space-md); padding-top: var(--space-sm); border-top: 1px solid var(--border-light); }
.replies-section h4 { font-size: 0.75rem; color: var(--text-muted); margin-bottom: var(--space-sm); }
.reply-item {
  padding: var(--space-sm); background: var(--bg); border-radius: var(--radius);
  margin-bottom: var(--space-xs); font-size: 0.8125rem;
}
.reply-item .reply-meta { font-size: 0.6875rem; color: var(--text-muted); }

/* Reply form */
.reply-form {
  margin-top: var(--space-md); padding-top: var(--space-sm); border-top: 1px solid var(--border-light);
}
.reply-form textarea {
  width: 100%; min-height: 60px; max-height: 200px; resize: vertical;
  background: var(--bg-input); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius); padding: var(--space-sm);
  font-family: var(--sans); font-size: 0.8125rem; line-height: 1.5;
}
.reply-form textarea:focus { outline: none; border-color: var(--accent); }
.reply-form-actions {
  display: flex; justify-content: flex-end; align-items: center; gap: var(--space-sm);
  margin-top: var(--space-xs);
}
.reply-form .btn-send {
  background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
  padding: 0.3rem 0.75rem; cursor: pointer; font-size: 0.75rem; font-weight: 500;
}
.reply-form .btn-send:hover { opacity: 0.9; }
.reply-form .btn-send:disabled { opacity: 0.4; cursor: default; }
.reply-form .reply-error { color: var(--red); font-size: 0.6875rem; }
.reply-form .reply-ok { color: var(--green); font-size: 0.6875rem; }

/* Pagination */
.pagination {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: var(--space-md); font-size: 0.75rem; color: var(--text-muted);
}
.pagination button {
  background: var(--bg-surface); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--radius); padding: 0.3rem 0.75rem;
  cursor: pointer; font-size: 0.75rem; transition: background 0.1s;
}
.pagination button:hover:not(:disabled) { background: var(--bg-hover); }
.pagination button:disabled { opacity: 0.4; cursor: default; }

/* Login */
.login-wrap {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: var(--space-lg);
}
.login-box {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: 8px; padding: var(--space-xl);
  width: 100%; max-width: 360px;
}
.login-box h2 { font-size: 1rem; margin-bottom: var(--space-lg); text-align: center; }
.login-box input {
  width: 100%; padding: 0.5rem 0.75rem; margin-bottom: var(--space-md);
  background: var(--bg-input); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius); font-family: var(--mono); font-size: 0.8125rem;
}
.login-box input:focus { outline: none; border-color: var(--accent); }
.login-box button {
  width: 100%; padding: 0.5rem; background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius); cursor: pointer;
  font-size: 0.8125rem; font-weight: 500;
}
.login-box button:hover { opacity: 0.9; }
.login-error { color: var(--red); font-size: 0.75rem; margin-bottom: var(--space-sm); text-align: center; }

/* Empty state */
.empty { text-align: center; color: var(--text-muted); padding: var(--space-xl); font-size: 0.8125rem; }

/* Loading */
.loading { text-align: center; color: var(--text-dim); padding: var(--space-xl); font-size: 0.8125rem; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

/* Agent config panel */
.agent-config {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: var(--space-md);
  margin: var(--space-sm) 0 var(--space-md);
  font-size: 0.8125rem; animation: fadeIn 0.15s ease;
}
.config-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);
}
@media (max-width: 640px) { .config-grid { grid-template-columns: 1fr; } }
.config-field label {
  display: block; font-size: 0.6875rem; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: var(--space-xs);
}
.config-field select, .config-field input {
  width: 100%; background: var(--bg-input); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 0.4rem 0.5rem; font-size: 0.8125rem; font-family: var(--sans);
}
.config-field select:focus, .config-field input:focus { outline: none; border-color: var(--accent); }
.config-field .hint { font-size: 0.625rem; color: var(--text-dim); margin-top: 2px; }
.config-actions {
  display: flex; justify-content: flex-end; align-items: center;
  gap: var(--space-sm); margin-top: var(--space-md); padding-top: var(--space-sm);
  border-top: 1px solid var(--border-light);
}
.config-actions .btn-save {
  background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
  padding: 0.35rem 1rem; cursor: pointer; font-size: 0.75rem; font-weight: 500;
}
.config-actions .btn-save:hover { opacity: 0.9; }
.config-actions .btn-save:disabled { opacity: 0.4; cursor: default; }
.config-actions .save-status { font-size: 0.6875rem; }
.config-actions .save-ok { color: var(--green); }
.config-actions .save-err { color: var(--red); }
.config-ro { color: var(--text-muted); font-size: 0.75rem; }
.config-ro code { font-family: var(--mono); font-size: 0.6875rem; }
.routing-row { display: flex; gap: var(--space-sm); align-items: center; margin-bottom: var(--space-xs); }
.routing-row span { font-size: 0.75rem; min-width: 4rem; }
.routing-row select { flex: 1; }

/* Responsive */
@media (max-width: 768px) {
  main { padding: var(--space-md); }
  .filters { gap: var(--space-xs); }
  .col-dir, .col-from { display: none; }
  td { font-size: 0.75rem; padding: var(--space-xs); }
}
</style>
</head>
<body>

<div id="login" class="login-wrap" style="display:none">
  <div class="login-box">
    <h2>hiboss dashboard</h2>
    <div id="login-error" class="login-error" style="display:none"></div>
    <input id="key-input" type="password" placeholder="API key (hb_...)" autofocus>
    <button onclick="doLogin()">Sign in</button>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <header>
    <h1>hiboss<span id="agent-name"></span></h1>
    <div class="header-right">
      <div id="refresh-dot" class="refresh-dot" title="Auto-refresh active"></div>
      <button class="btn-logout" onclick="logout()">sign out</button>
    </div>
  </header>
  <nav>
    <button class="active" data-tab="messages" onclick="switchTab('messages')">Messages</button>
    <button data-tab="sessions" onclick="switchTab('sessions')">Sessions</button>
    <button data-tab="agents" onclick="switchTab('agents')">Agents</button>
    <button data-tab="settings" onclick="switchTab('settings')" id="tab-settings" style="display:none">Settings</button>
  </nav>
  <main id="content"></main>
</div>

<script>
/* -- State -- */
let apiKey = '';
let baseUrl = '';
let authMode = 'agent'; // 'agent' or 'boss'
let currentTab = 'messages';
let msgOffset = 0;
let msgTotal = 0;
let expandedId = null;
let expandedAgentId = null;
let refreshTimer = null;
const LIMIT = 50;
const STALE_MIN = 15;

/* -- Filters -- */
let filters = { direction: '', status: '', priority: '', search: '' };

/* -- Init -- */
(function init() {
  baseUrl = window.location.origin;
  const params = new URLSearchParams(window.location.search);
  const urlKey = params.get('key');
  if (urlKey) {
    apiKey = urlKey;
    localStorage.setItem('hiboss_key', urlKey);
    // Strip key from URL for security
    history.replaceState(null, '', window.location.pathname);
  } else {
    apiKey = localStorage.getItem('hiboss_key') || '';
  }
  authMode = localStorage.getItem('hiboss_auth_mode') || 'agent';
  if (apiKey) {
    showApp();
  } else {
    document.getElementById('login').style.display = 'flex';
  }
})();

function doLogin() {
  const input = document.getElementById('key-input');
  const key = input.value.trim();
  if (!key) return;
  apiKey = key;
  // Try agent auth first, then boss auth
  apiFetch('/api/agents/me').then(data => {
    authMode = 'agent';
    localStorage.setItem('hiboss_key', key);
    localStorage.setItem('hiboss_auth_mode', 'agent');
    document.getElementById('login').style.display = 'none';
    showApp();
  }).catch(() => {
    apiFetch('/api/boss/me').then(data => {
      authMode = 'boss';
      localStorage.setItem('hiboss_key', key);
      localStorage.setItem('hiboss_auth_mode', 'boss');
      document.getElementById('login').style.display = 'none';
      showApp();
    }).catch(() => {
      document.getElementById('login-error').textContent = 'Invalid API key';
      document.getElementById('login-error').style.display = 'block';
      apiKey = '';
    });
  });
}

document.getElementById('key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function logout() {
  apiKey = '';
  localStorage.removeItem('hiboss_key');
  localStorage.removeItem('hiboss_auth_mode');
  clearInterval(refreshTimer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('key-input').value = '';
}

/* -- API -- */
async function apiFetch(path, opts = {}) {
  const res = await fetch(baseUrl + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + apiKey, ...(opts.headers || {}) }
  });
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  return res.json();
}

/* -- App -- */
async function showApp() {
  document.getElementById('app').style.display = 'flex';
  try {
    if (authMode === 'boss') {
      const me = await apiFetch('/api/boss/me');
      document.getElementById('agent-name').textContent = (me.name || me.id.slice(0, 8)) + ' (boss)';
      document.getElementById('tab-settings').style.display = '';
    } else {
      const me = await apiFetch('/api/agents/me');
      document.getElementById('agent-name').textContent = me.name || me.id.slice(0, 8);
      document.getElementById('tab-settings').style.display = 'none';
    }
  } catch { /* ignore */ }
  switchTab('messages');
  startRefresh();
}

function startRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if (currentTab === 'messages') loadMessages(true);
  }, 10000);
}

/* -- Tab switching -- */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  expandedId = null;
  if (tab === 'messages') { msgOffset = 0; loadMessages(); }
  else if (tab === 'sessions') loadSessions();
  else if (tab === 'agents') loadAgents();
  else if (tab === 'settings') loadSettings();
}

/* -- Messages -- */
async function loadMessages(quiet = false) {
  const el = document.getElementById('content');
  if (!quiet) el.innerHTML = '<div class="loading">Loading...</div>';

  const params = new URLSearchParams({ limit: LIMIT, offset: msgOffset });
  if (filters.direction) params.set('direction', filters.direction);
  if (filters.status) params.set('status', filters.status);
  if (filters.priority) params.set('priority', filters.priority);
  if (filters.search) params.set('search', filters.search);

  try {
    const endpoint = authMode === 'boss' ? '/api/boss/messages' : '/api/messages';
    const data = await apiFetch(endpoint + '?' + params);
    msgTotal = data.total || 0;
    renderMessages(data.messages || [], msgTotal);
  } catch (e) {
    if (!quiet) el.innerHTML = '<div class="empty">Failed to load messages</div>';
  }
}

function renderMessages(messages, total) {
  const el = document.getElementById('content');
  const dirs = [['', 'All directions'], ['agent_to_boss', 'Agent to Boss'], ['boss_to_agent', 'Boss to Agent'], ['agent_to_agent', 'Agent to Agent']];
  const stats = [['', 'All statuses'], ['sent', 'Sent'], ['delivered', 'Delivered'], ['read', 'Read'], ['replied', 'Replied']];
  const pris = [['', 'All priorities'], ['critical', 'Critical'], ['high', 'High'], ['normal', 'Normal'], ['low', 'Low']];

  let html = '<div class="filters">';
  html += sel('direction', dirs, filters.direction);
  html += sel('status', stats, filters.status);
  html += sel('priority', pris, filters.priority);
  html += `<input type="text" id="search-input" placeholder="Search messages..." value="${esc(filters.search)}" style="flex:1;min-width:120px">`;
  html += '</div>';

  if (messages.length === 0) {
    html += '<div class="empty">No messages found</div>';
  } else {
    html += `<table><thead><tr>
      <th class="col-id">ID</th>
      <th class="col-from">From</th>
      <th class="col-dir">Direction</th>
      <th class="col-priority">Priority</th>
      <th class="col-body">Body</th>
      <th class="col-status">Status</th>
      <th class="col-time">Time</th>
    </tr></thead><tbody>`;
    for (const m of messages) {
      const expanded = expandedId === m.id;
      html += `<tr onclick="toggleMsg('${m.id}')" class="${expanded ? 'expanded' : ''}">
        <td class="col-id">${esc(m.id.slice(0, 8))}</td>
        <td class="col-from">${esc(m.agent_name || m.agent_id?.slice(0, 8) || '-')}</td>
        <td class="col-dir">${dirLabel(m.direction)}</td>
        <td class="col-priority">${priBadge(m.priority)}</td>
        <td class="col-body">${esc(m.body?.slice(0, 120) || '')}</td>
        <td class="col-status">${statusBadge(m.status)}</td>
        <td class="col-time">${relTime(m.created_at)}</td>
      </tr>`;
      if (expanded) {
        html += `<tr><td colspan="7" style="padding:0;border:none"><div id="detail-${m.id}" class="msg-detail"><div class="loading">Loading...</div></div></td></tr>`;
      }
    }
    html += '</tbody></table>';
  }

  // Pagination
  const pages = Math.ceil(total / LIMIT);
  const page = Math.floor(msgOffset / LIMIT) + 1;
  html += `<div class="pagination">
    <span>${total} message${total !== 1 ? 's' : ''}</span>
    <div>
      <button onclick="paginate(-1)" ${msgOffset === 0 ? 'disabled' : ''}>Prev</button>
      <span style="margin:0 0.5rem">${page} / ${pages || 1}</span>
      <button onclick="paginate(1)" ${msgOffset + LIMIT >= total ? 'disabled' : ''}>Next</button>
    </div>
  </div>`;

  el.innerHTML = html;

  // Bind filter change events
  el.querySelectorAll('.filters select').forEach(s => {
    s.addEventListener('change', e => {
      filters[e.target.dataset.key] = e.target.value;
      msgOffset = 0;
      loadMessages();
    });
  });
  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    let searchTimer = null;
    searchInput.addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        filters.search = e.target.value.trim();
        msgOffset = 0;
        loadMessages();
      }, 400);
    });
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { clearTimeout(searchTimer); filters.search = e.target.value.trim(); msgOffset = 0; loadMessages(); }
    });
  }

  // If a message is expanded, load its detail
  if (expandedId) loadMsgDetail(expandedId);
}

function sel(key, options, value) {
  let h = `<select data-key="${key}">`;
  for (const [v, label] of options) {
    h += `<option value="${v}" ${v === value ? 'selected' : ''}>${label}</option>`;
  }
  return h + '</select>';
}

async function toggleMsg(id) {
  if (expandedId === id) { expandedId = null; }
  else { expandedId = id; }
  // Re-render in place without full reload
  loadMessages(true);
}

async function loadMsgDetail(id) {
  const el = document.getElementById('detail-' + id);
  if (!el) return;
  try {
    const endpoint = authMode === 'boss' ? '/api/boss/messages/' : '/api/messages/';
    const m = await apiFetch(endpoint + id);
    let html = `<pre>${esc(m.body)}</pre>`;
    html += '<div class="meta-row">';
    html += `<span>ID: <code style="font-family:var(--mono)">${esc(m.id)}</code></span>`;
    html += `<span>Channel: ${esc(m.channel || 'none')}</span>`;
    html += `<span>Type: ${esc(m.type || 'text')}</span>`;
    html += `<span>Mode: ${esc(m.mode)}</span>`;
    if (m.session_id) html += `<span>Session: <code style="font-family:var(--mono)">${esc(m.session_id.slice(0, 8))}</code></span>`;
    html += `<span>${esc(m.created_at)}</span>`;
    html += '</div>';
    if (m.metadata) {
      html += `<div class="meta-row"><span>Metadata: <code style="font-family:var(--mono);font-size:0.6875rem">${esc(JSON.stringify(m.metadata))}</code></span></div>`;
    }
    if (m.replies && m.replies.length > 0) {
      html += '<div class="replies-section"><h4>Replies</h4>';
      for (const r of m.replies) {
        html += `<div class="reply-item">
          <pre>${esc(r.body)}</pre>
          <div class="reply-meta">${dirLabel(r.direction)} &middot; ${esc(r.agent_name || r.agent_id?.slice(0, 8) || '')} &middot; ${relTime(r.created_at)}</div>
        </div>`;
      }
      html += '</div>';
    }
    // Reply form
    html += `<div class="reply-form">
      <textarea id="reply-input-${m.id}" placeholder="Type a reply..." onkeydown="replyKeydown(event, '${m.id}')"></textarea>
      <div class="reply-form-actions">
        <span id="reply-status-${m.id}"></span>
        <button class="btn-send" onclick="sendReply('${m.id}')">Reply</button>
      </div>
    </div>`;
    el.innerHTML = html;
  } catch {
    el.innerHTML = '<div class="empty">Failed to load detail</div>';
  }
}

function paginate(dir) {
  msgOffset = Math.max(0, msgOffset + dir * LIMIT);
  expandedId = null;
  loadMessages();
}

/* -- Sessions -- */
async function loadSessions() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const endpoint = authMode === 'boss' ? '/api/boss/sessions' : '/api/sessions?all=true';
    const data = await apiFetch(endpoint);
    const sessions = data.sessions || [];
    if (sessions.length === 0) {
      el.innerHTML = '<div class="empty">No active sessions</div>';
      return;
    }
    const cols = [
      { key: 'working', icon: '🔨', label: 'Working', cls: 'status-working' },
      { key: 'blocked', icon: '🚫', label: 'Blocked', cls: 'status-blocked' },
      { key: 'waiting', icon: '⏳', label: 'Waiting', cls: 'status-waiting' },
      { key: 'idle', icon: '💤', label: 'Idle', cls: 'status-session-idle' },
      { key: 'completed', icon: '✅', label: 'Done', cls: 'status-completed' },
    ];
    let html = '<div class="kanban">';
    for (const col of cols) {
      const items = sessions.filter(s => (s.status || 'working') === col.key);
      html += `<div class="kanban-col"><div class="kanban-header ${col.cls}">${col.icon} ${col.label} <span class="count">(${items.length})</span></div>`;
      for (const s of items) {
        const stale = isStale(s.last_seen_at);
        html += `<div class="kanban-card ${col.cls}">
          <div class="card-label">${esc(s.label || s.id.slice(0, 8))}</div>
          <div class="card-agent">${esc(s.agent_name || s.agent_id?.slice(0, 8) || '-')}${stale ? ' <span style="color:var(--yellow)">(stale)</span>' : ''}</div>
          ${s.status_text ? `<div class="card-text">${esc(s.status_text)}</div>` : ''}
          <div class="card-time">${relTime(s.last_seen_at)}</div>
        </div>`;
      }
      html += '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
  } catch {
    el.innerHTML = '<div class="empty">Failed to load sessions</div>';
  }
}

function isStale(ts) {
  if (!ts) return true;
  return (Date.now() - new Date(ts + (ts.endsWith('Z') ? '' : 'Z')).getTime()) > STALE_MIN * 60 * 1000;
}

/* -- Agents -- */
async function loadAgents() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const endpoint = authMode === 'boss' ? '/api/boss/agents' : '/api/agents';
    const data = await apiFetch(endpoint);
    const agents = data.agents || [];
    if (agents.length === 0) { el.innerHTML = '<div class="empty">No agents found</div>'; return; }
    let html = `<table><thead><tr>
      <th>Name</th><th>Role</th><th>Status</th>
      <th class="col-time">Last Used</th><th class="col-time">Created</th>
    </tr></thead><tbody>`;
    for (const a of agents) {
      const expanded = expandedAgentId === a.id;
      html += `<tr onclick="toggleAgent('${a.id}')">
        <td><strong>${esc(a.name || a.id.slice(0, 8))}</strong></td>
        <td>${esc(a.role || '-')}</td>
        <td><span class="status-dot status-${a.status || 'offline'}"></span>${esc(a.status || 'offline')}</td>
        <td class="col-time">${a.last_used_at ? relTime(a.last_used_at) : '-'}</td>
        <td class="col-time">${relTime(a.created_at)}</td>
      </tr>`;
      if (expanded) {
        html += `<tr><td colspan="5" style="padding:0;border:none"><div id="agent-cfg-${a.id}" class="agent-config"><div class="loading">Loading config...</div></div></td></tr>`;
      }
    }
    html += '</tbody></table>';
    el.innerHTML = html;
    if (expandedAgentId) loadAgentConfig(expandedAgentId);
  } catch { el.innerHTML = '<div class="empty">Failed to load agents</div>'; }
}

function toggleAgent(id) {
  expandedAgentId = expandedAgentId === id ? null : id;
  loadAgents();
}

async function loadAgentConfig(agentId) {
  const el = document.getElementById('agent-cfg-' + agentId);
  if (!el) return;
  try {
    const data = await apiFetch('/api/agents/me');
    const isSelf = data.id === agentId;
    const cr = data.channel_routing || {};
    let html = '<div class="config-grid">';
    if (isSelf) {
      html += configField('Default Priority', `<select id="cfg-priority">
        ${['critical','high','normal','low'].map(p => `<option value="${p}" ${data.default_priority === p ? 'selected' : ''}>${p}</option>`).join('')}
      </select>`, 'Priority for messages without explicit --priority');
      html += configField('Rate Limit', `<input id="cfg-ratelimit" type="number" min="0" value="${data.rate_limit ?? ''}" placeholder="No limit">`, 'Messages per minute (0 or empty = unlimited)');
      html += configField('Role', `<select id="cfg-role">
        <option value="" ${!data.role ? 'selected' : ''}>None</option>
        ${['orchestrator','worker','reviewer'].map(r => `<option value="${r}" ${data.role === r ? 'selected' : ''}>${r}</option>`).join('')}
      </select>`, 'Agent role hint');
      html += configField('Avatar URL', `<input id="cfg-avatar" type="url" value="${esc(data.avatar_url || '')}" placeholder="https://...">`, 'For Discord webhook messages');
      html += '</div>';
      html += '<div style="margin-top:var(--space-md)"><label style="display:block;font-size:0.6875rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:var(--space-xs)">Channel Routing</label>';
      html += '<div class="config-ro hint" style="margin-bottom:var(--space-xs)">Route messages to specific channels by priority</div>';
      for (const p of ['critical','high','normal','low']) {
        html += `<div class="routing-row"><span>${p}</span><select id="cfg-route-${p}">
          <option value="">Default</option>
          ${['discord','telegram','email'].map(ch => `<option value="${ch}" ${cr[p] === ch ? 'selected' : ''}>${ch}</option>`).join('')}
        </select></div>`;
      }
      html += '</div>';
      html += `<div class="config-actions">
        <span id="cfg-status"></span>
        <button class="btn-save" onclick="saveAgentConfig()">Save</button>
      </div>`;
    } else {
      html += configField('ID', `<div class="config-ro"><code>${esc(agentId)}</code></div>`);
      html += configField('Default Priority', `<div class="config-ro">${esc(data.default_priority || 'normal')}</div>`);
      html += configField('Rate Limit', `<div class="config-ro">${data.rate_limit ?? 'No limit'}</div>`);
      html += configField('Role', `<div class="config-ro">${esc(data.role || 'None')}</div>`);
      html += '</div><div class="config-ro" style="margin-top:var(--space-sm);color:var(--text-dim)">Config editing available only for your own agent</div>';
    }
    el.innerHTML = html;
  } catch {
    el.innerHTML = '<div class="config-ro">Failed to load config. Only the agent itself can view its full config.</div>';
  }
}

function configField(label, content, hint) {
  return `<div class="config-field"><label>${label}</label>${content}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}

async function saveAgentConfig() {
  const status = document.getElementById('cfg-status');
  const btn = document.querySelector('.config-actions .btn-save');
  btn.disabled = true;
  status.className = 'save-status';
  status.textContent = 'Saving...';
  const payload = {};
  payload.default_priority = document.getElementById('cfg-priority').value;
  const rl = document.getElementById('cfg-ratelimit').value;
  payload.rate_limit = rl === '' || rl === '0' ? null : parseInt(rl, 10);
  const role = document.getElementById('cfg-role').value;
  payload.role = role || null;
  const av = document.getElementById('cfg-avatar').value.trim();
  payload.avatar_url = av || null;
  const routing = {};
  let hasRouting = false;
  for (const p of ['critical','high','normal','low']) {
    const v = document.getElementById('cfg-route-' + p).value;
    if (v) { routing[p] = v; hasRouting = true; }
  }
  payload.channel_routing = hasRouting ? routing : null;
  try {
    await apiFetch('/api/agents/me/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    status.className = 'save-status save-ok';
    status.textContent = 'Saved';
    setTimeout(() => { status.textContent = ''; }, 2000);
  } catch (e) {
    status.className = 'save-status save-err';
    status.textContent = 'Error: ' + e.message;
  } finally { btn.disabled = false; }
}

/* -- Settings (Boss) -- */
async function loadSettings() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const [me, prefs] = await Promise.all([apiFetch('/api/boss/me'), apiFetch('/api/boss/me/preferences')]);
    let html = '<div style="max-width:600px">';
    html += '<h3 style="font-size:0.875rem;margin-bottom:var(--space-md)">Boss Profile</h3>';
    html += '<div class="config-grid">';
    html += configField('Name', `<div class="config-ro">${esc(me.name)}</div>`);
    html += configField('Role', `<div class="config-ro">${esc(me.role)}</div>`);
    html += configField('Telegram ID', `<div class="config-ro"><code>${esc(me.telegram_user_id || 'Not set')}</code></div>`);
    html += configField('Discord ID', `<div class="config-ro"><code>${esc(me.discord_user_id || 'Not set')}</code></div>`);
    html += '</div>';
    html += '<h3 style="font-size:0.875rem;margin:var(--space-lg) 0 var(--space-md)">Preferences</h3>';
    html += '<div class="config-grid">';
    html += configField('Preferred Channel', `<select id="pref-channel">
      <option value="" ${!prefs.preferred_channel ? 'selected' : ''}>Default</option>
      ${['telegram','discord','email'].map(ch => `<option value="${ch}" ${prefs.preferred_channel === ch ? 'selected' : ''}>${ch}</option>`).join('')}
    </select>`, 'Channel for receiving notifications');
    html += configField('Timezone', `<input id="pref-tz" type="text" value="${esc(prefs.timezone || '')}" placeholder="e.g. Asia/Shanghai">`, 'Used for quiet hours calculation');
    html += '</div>';
    html += '<div style="margin-top:var(--space-md)"><label style="display:block;font-size:0.6875rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:var(--space-xs)">Quiet Hours</label>';
    html += '<div class="config-ro hint" style="margin-bottom:var(--space-xs)">Suppress notifications during these hours</div>';
    html += '<div style="display:flex;gap:var(--space-sm);align-items:center">';
    html += `<input id="pref-qstart" type="time" value="${esc(prefs.quiet_hours?.start || '')}" style="background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:0.3rem;font-size:0.8125rem">`;
    html += '<span style="color:var(--text-muted)">to</span>';
    html += `<input id="pref-qend" type="time" value="${esc(prefs.quiet_hours?.end || '')}" style="background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:0.3rem;font-size:0.8125rem">`;
    html += '</div></div>';
    html += '<div style="margin-top:var(--space-md)"><label style="display:block;font-size:0.6875rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:var(--space-xs)">Notification Priorities</label>';
    html += '<div class="config-ro hint" style="margin-bottom:var(--space-xs)">Only notify for these priority levels</div>';
    const np = prefs.notify_priorities || [];
    for (const p of ['critical','high','normal','low']) {
      html += `<label style="display:flex;align-items:center;gap:var(--space-xs);font-size:0.8125rem;margin-bottom:2px">
        <input type="checkbox" class="pref-np" value="${p}" ${np.includes(p) ? 'checked' : ''}> ${p}
      </label>`;
    }
    html += '</div>';
    html += `<div class="config-actions">
      <span id="pref-status"></span>
      <button class="btn-save" onclick="savePreferences()">Save Preferences</button>
    </div></div>`;
    el.innerHTML = html;
  } catch { el.innerHTML = '<div class="empty">Failed to load settings</div>'; }
}

async function savePreferences() {
  const status = document.getElementById('pref-status');
  const btn = document.querySelector('.config-actions .btn-save');
  btn.disabled = true;
  status.className = 'save-status'; status.textContent = 'Saving...';
  const payload = {};
  const ch = document.getElementById('pref-channel').value;
  payload.preferred_channel = ch || null;
  const tz = document.getElementById('pref-tz').value.trim();
  if (tz) payload.timezone = tz;
  const qs = document.getElementById('pref-qstart').value;
  const qe = document.getElementById('pref-qend').value;
  if (qs && qe) { payload.quiet_hours = { start: qs, end: qe }; }
  else { payload.quiet_hours = null; }
  const checks = document.querySelectorAll('.pref-np:checked');
  payload.notify_priorities = Array.from(checks).map(c => c.value);
  if (payload.notify_priorities.length === 0) delete payload.notify_priorities;
  try {
    await apiFetch('/api/boss/me/preferences', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    status.className = 'save-status save-ok'; status.textContent = 'Saved';
    setTimeout(() => { status.textContent = ''; }, 2000);
  } catch (e) {
    status.className = 'save-status save-err'; status.textContent = 'Error: ' + e.message;
  } finally { btn.disabled = false; }
}

/* -- Reply -- */
async function sendReply(msgId) {
  const input = document.getElementById('reply-input-' + msgId);
  const status = document.getElementById('reply-status-' + msgId);
  const body = input.value.trim();
  if (!body) return;
  const btn = input.parentElement.querySelector('.btn-send');
  btn.disabled = true;
  status.className = 'reply-ok';
  status.textContent = 'Sending...';
  try {
    const endpoint = authMode === 'boss'
      ? '/api/boss/messages/' + msgId + '/reply'
      : '/api/messages/' + msgId + '/reply';
    await apiFetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ body })
    });
    input.value = '';
    status.textContent = '';
    loadMsgDetail(msgId); // Refresh to show new reply
  } catch (e) {
    status.className = 'reply-error';
    status.textContent = 'Failed to send: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

function replyKeydown(e, msgId) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    sendReply(msgId);
  }
}

/* -- Helpers -- */
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function dirLabel(d) {
  if (d === 'agent_to_boss') return '<span class="dir-out">agent &rarr; boss</span>';
  if (d === 'boss_to_agent') return '<span class="dir-in">boss &rarr; agent</span>';
  if (d === 'agent_to_agent') return '<span class="dir-agent">agent &rarr; agent</span>';
  return esc(d || '-');
}

function priBadge(p) {
  const cls = { critical: 'critical', high: 'high', normal: 'normal', low: 'low' }[p] || 'normal';
  return `<span class="badge badge-${cls}">${esc(p)}</span>`;
}

function statusBadge(s) {
  const cls = { sent: 'sent', delivered: 'delivered', read: 'read', replied: 'replied' }[s] || '';
  return `<span class="badge-${cls}">${esc(s)}</span>`;
}

function relTime(ts) {
  if (!ts) return '-';
  const t = new Date(ts + (ts.endsWith('Z') ? '' : 'Z')).getTime();
  const diff = Date.now() - t;
  if (diff < 0) return 'just now';
  if (diff < 60000) return Math.floor(diff / 1000) + 's ago';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
  return new Date(t).toLocaleDateString();
}
