<!--
Localized en interactive Island demo and its native screenshot fallback.
Expanded by render.py; interactions are provided by island-demo.js.
-->
        <figure class="island-stage" data-island-stage>
          <picture class="island-fallback">
            <source srcset="/assets/shots/mac-island-dark.jpg" media="(prefers-color-scheme: dark)">
            <img class="island-shot" src="/assets/shots/mac-island-light.jpg"
              width="840" height="592" loading="lazy"
              alt="Native Mac Island: two choices with descriptions and a default badge.">
          </picture>
          <div class="island-demo" data-island-demo hidden data-state="waiting"
            data-reply-prefix="Demo reply: " data-closed-message="Card closed. Try again to reopen it.">
            <div class="island-card" role="group" aria-labelledby="island-question">
              <div class="island-card-head">
                <div><strong><span class="island-dot" aria-hidden="true"></span>mac-client</strong>
                  <p>Chooses Sidebar by default</p></div>
                <button class="island-close" type="button" aria-label="Close demo card">×</button>
              </div>
              <h3 id="island-question">Which navigation should we ship?</h3>
              <div class="island-choices">
                <button type="button" data-choice="Sidebar" data-default aria-pressed="false">
                  <span class="island-choice-title"><kbd aria-hidden="true">↵</kbd>Sidebar
                    <span class="island-default">default</span></span>
                  <span class="island-choice-description">Keep projects and sessions within easy reach.</span>
                </button>
                <button type="button" data-choice="Tabs" aria-pressed="false">
                  <span class="island-choice-title">Tabs</span>
                  <span class="island-choice-description">Give the active workspace more room.</span>
                </button>
              </div>
              <form class="island-reply">
                <input type="text" maxlength="280" autocomplete="off"
                  placeholder="Reply with your own instruction…"
                  aria-label="Reply with your own instruction…">
                <button type="submit" aria-label="Send demo reply">↑</button>
              </form>
            </div>
            <p class="island-feedback" role="status" aria-live="polite"></p>
            <button class="island-replay" type="button" hidden>Try again</button>
          </div>
          <figcaption>
            <span class="island-fallback">HiBoss for Mac · Option descriptions and the default choice.</span>
            <span class="island-interactive-caption">Interactive demo · Choose an option or type your own reply.
              This preview stays on this page.</span></figcaption>
        </figure>
