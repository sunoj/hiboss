Add tests for two untested server route files: stream.ts and reactions.ts.

## Context
- Project: hiboss (AI agent ↔ boss communication)
- Server: Cloudflare Worker with Hono framework, D1 database
- Test framework: vitest (see server/vitest.config.mts)
- Test pattern: see existing test files in server/src/routes/*.test.ts for the pattern
- Test helpers: server/src/test-helpers.ts provides createTestEnv() and related utilities

## File 1: server/src/routes/stream.ts (134 lines)
SSE streaming endpoint at GET /api/messages/stream
- Polls D1 every 2s for new messages (boss_to_agent + agent_to_agent)
- Sends SSE events (event: message\ndata: {...}\n\n)
- Marks messages as delivered
- Supports session filtering (?session=X)
- Has keepalive every 15s
- Max duration 5 minutes
- Already has exported pure functions: buildStreamQuery, pruneSeenMessageIds

Create: server/src/routes/stream.test.ts
Tests needed:
1. buildStreamQuery returns correct SQL for agent-only (no session)
2. buildStreamQuery returns correct SQL with session ID
3. pruneSeenMessageIds clears set when no rows
4. pruneSeenMessageIds clears set when floor advances past lastCheck
5. pruneSeenMessageIds keeps set when floor <= lastCheck
6. Integration: GET /stream returns SSE content-type headers
7. Integration: GET /stream delivers pending messages as SSE events

## File 2: server/src/routes/reactions.ts (71 lines)
Reaction endpoints: POST /:id/react and GET /:id/reactions
- POST /react: Sends emoji reaction to Telegram message (via stored telegram_message_id)
- GET /reactions: Returns reactions from Discord (via stored discord_message_id) or metadata

Create: server/src/routes/reactions.test.ts
Tests needed:
1. POST /:id/react returns 400 when emoji missing
2. POST /:id/react returns 404 for unknown message
3. POST /:id/react returns 400 for non-telegram channel
4. GET /:id/reactions returns empty array for message without reactions
5. GET /:id/reactions returns reactions from metadata

## Rules
- Follow existing test patterns exactly (look at messages.test.ts, admin.test.ts)
- Use test-helpers.ts createTestEnv() for D1 mock
- Each test file ≤ 300 lines
- No mocking external HTTP calls (Telegram/Discord) — only test local logic and DB
- File headers: 2-4 line comment (purpose, exports, deps)
"""
context = ["server/src/routes/stream.ts", "server/src/routes/reactions.ts", "server/src/test-helpers.ts", "server/src/routes/admin.test.ts:1-60"]

