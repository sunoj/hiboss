## 8. Thread routing logic: server/src/routes/message-options.ts

Add a new exported async function at the end of the file:
```typescript
/** Auto-create a Discord thread for this session if use_threads is enabled. */
export async function ensureThreadForSession(
  env: Env,
  agentId: string,
  sessionId: string | null,
  channelConfig: { channel: Channel; config: Record<string, unknown> },
  discordMessageId: string | undefined,
): Promise<string | undefined> {
  if (channelConfig.channel !== 'discord') return undefined;
  const cfg = channelConfig.config;
  if (!cfg['use_threads']) return undefined;
  if (!sessionId) return undefined;

  // Check if session already has a thread
  const session = await env.DB
    .prepare('SELECT discord_thread_id FROM sessions WHERE id = ?')
    .bind(sessionId)
    .first<{ discord_thread_id: string | null }>();
  if (session?.discord_thread_id) return session.discord_thread_id;

  // Need a discord message ID to create a thread from
  if (!discordMessageId) return undefined;

  const botToken = cfg['bot_token'] as string | undefined;
  const channelId = cfg['channel_id'] as string | undefined;
  if (!botToken || !channelId) return undefined;

  const agentName = await fetchAgentName(env, agentId) ?? 'agent';
  const sessionRow = await env.DB
    .prepare('SELECT label, branch FROM sessions WHERE id = ?')
    .bind(sessionId)
    .first<{ label: string | null; branch: string | null }>();
  const threadName = sessionRow?.label ?? sessionRow?.branch ?? `${agentName}-session`;

  try {
    const { createDiscordThread } = await import('../channels/discord');
    const threadId = await createDiscordThread(botToken, channelId, discordMessageId, threadName);
    await env.DB
      .prepare('UPDATE sessions SET discord_thread_id = ? WHERE id = ?')
      .bind(threadId, sessionId)
      .run();
    return threadId;
  } catch {
    // Thread creation failed — deliver without thread
    return undefined;
  }
}
```

Also add the import for `createDiscordThread` at the top (from '../channels/discord').

## 9. Wire up in messages.ts delivery

This is the trickiest part. In server/src/routes/messages.ts, the delivery flow is:

1. Send message to channel → get discordMessageId back
2. Store discordMessageId in metadata

For threads, we need to:
- On the FIRST message of a session: send to main channel, create thread from that message, store thread_id
- On SUBSEQUENT messages: send directly to the thread (by overriding channelId to thread_id)

Find where `deliverToChannelWithOptions` is called in the delivery loop. Before that call, check if the session has a `discord_thread_id`. If yes, temporarily override the channel config's `channel_id` to the thread_id so messages go to the thread.

The modification should be in the `channelConfigs.map` callback inside `Promise.allSettled`. Add this logic:

```typescript
// Before delivering, check for session thread routing
const effectiveConfig = { ...cc.config };
if (cc.channel === 'discord' && sessionId && cc.config['use_threads']) {
  const sess = await c.env.DB
    .prepare('SELECT discord_thread_id FROM sessions WHERE id = ?')
    .bind(sessionId)
    .first<{ discord_thread_id: string | null }>();
  if (sess?.discord_thread_id) {
    effectiveConfig['channel_id'] = sess.discord_thread_id;
  }
}
```

Then use `effectiveConfig` instead of `cc.config` in the `deliverToChannelWithOptions` call.

After delivery, if the session doesn't have a thread yet and we got a discordMessageId, create the thread:

After the `dcResult?.discordMessageId` metadata storage (around line 232), add:
```typescript
if (dcResult?.discordMessageId && sessionId) {
  const dcCC = channelConfigs.find(cc => cc.channel === 'discord');
  if (dcCC?.config['use_threads']) {
    c.executionCtx.waitUntil(
      ensureThreadForSession(c.env, agentId, sessionId, dcCC, dcResult.discordMessageId)
    );
  }
}
```

Import `ensureThreadForSession` at the top from './message-options'.

## 10. Inbound routing: server/src/routes/webhook-helpers.ts

In `insertBossDiscordMessage`, the first step is `findEnabledChannelConfig(env, 'discord', channelId)`.
When a boss replies in a thread, `channelId` will be the thread's ID, not the main channel's ID.
The existing lookup will fail because the channel config stores the main channel_id.

Add a fallback: if the first lookup fails, check if channelId matches a `discord_thread_id` in sessions:

After the existing `findEnabledChannelConfig` call (line 117), add:
```typescript
if (!agentRow) {
  // Check if this is a thread — look up by discord_thread_id in sessions
  const threadSession = await env.DB
    .prepare('SELECT s.agent_id, s.id AS session_id FROM sessions s WHERE s.discord_thread_id = ? LIMIT 1')
    .bind(channelId)
    .first<{ agent_id: string; session_id: string }>();
  if (threadSession) {
    // Find the channel config for this agent
    const cc = await env.DB
      .prepare("SELECT agent_id, config FROM channel_configs WHERE agent_id = ? AND channel = 'discord' AND enabled = 1 LIMIT 1")
      .bind(threadSession.agent_id)
      .first<{ agent_id: string; config: string }>();
    if (cc) {
      agentRow = cc;
    }
  }
}
```

Note: `agentRow` is declared with `const`, change it to `let` so it can be reassigned.

