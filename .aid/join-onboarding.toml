prompt = """
Rewrite the CLI `init` command to use the new join-based onboarding flow instead of the old bootstrap endpoint.

## Rewrite: cli/src/commands/init.rs

Replace the entire file content with the new join flow:

```rust
// Purpose: Initialize hiboss by joining a server via the join/approve flow.
// Exports: InitArgs, run().
// Dependencies: clap, reqwest, serde, colored, crate::config.

use crate::config::{save_config, Config};
use clap::Args;
use colored::Colorize;
use reqwest::{Client, StatusCode};
use serde::Deserialize;
use std::error::Error;

#[derive(Debug, Args)]
pub struct InitArgs {
    #[arg(value_name = "server")]
    pub server: String,
}

#[derive(Deserialize)]
struct JoinResponse {
    request_id: String,
    poll_token: String,
    status: String,
    #[serde(default)]
    key: Option<String>,
    #[serde(default)]
    agent_id: Option<String>,
}

#[derive(Deserialize)]
struct JoinStatusResponse {
    status: String,
    #[serde(default)]
    key: Option<String>,
    #[serde(default)]
    agent_id: Option<String>,
    #[serde(default)]
    name: Option<String>,
}

pub async fn run(args: &InitArgs, config: &mut Config) -> Result<(), Box<dyn Error>> {
    let server = args.server.trim_end_matches('/');
    let name = detect_name();
    let client = Client::new();

    // Step 1: Send join request
    let resp = client
        .post(format!("{}/api/join", server))
        .json(&serde_json::json!({ "name": name }))
        .send()
        .await?;

    if !resp.status().is_success() {
        let status = resp.status();
        let body = resp.text().await.unwrap_or_default();
        return Err(format!("join request failed ({}): {}", status, body).into());
    }

    let join: JoinResponse = resp.json().await?;

    // Step 2: Handle response
    if join.status == "approved" {
        // Auto-approved (first device)
        let key = join.key.ok_or("server returned approved but no key")?;
        let agent_id = join.agent_id.unwrap_or_default();
        save_init(config, server, &key)?;
        print_success(server, &name, &agent_id);
        return Ok(());
    }

    // Step 3: Pending — poll for approval
    eprintln!(
        "{} Waiting for boss approval... (request: {})",
        "⏳".yellow(),
        &join.request_id[..8.min(join.request_id.len())]
    );
    eprintln!("   The boss has been notified on their channel.");

    let poll_url = format!("{}/api/join/status?token={}", server, join.poll_token);
    let timeout = std::time::Duration::from_secs(300);
    let start = std::time::Instant::now();
    let mut polls = 0u32;

    loop {
        tokio::time::sleep(std::time::Duration::from_secs(3)).await;
        polls += 1;

        if start.elapsed() > timeout {
            eprintln!(
                "{} Timed out waiting for approval. Ask your boss to approve, then run:",
                "⏱".red()
            );
            eprintln!("  hiboss init {}", server);
            return Err("approval timed out".into());
        }

        let status_resp = client.get(&poll_url).send().await;
        let status_resp = match status_resp {
            Ok(r) => r,
            Err(_) => continue, // Network hiccup, retry
        };

        if !status_resp.status().is_success() {
            continue;
        }

        let status: JoinStatusResponse = match status_resp.json().await {
            Ok(s) => s,
            Err(_) => continue,
        };

        match status.status.as_str() {
            "approved" => {
                let key = status.key.ok_or("approved but no key returned")?;
                let agent_id = status.agent_id.unwrap_or_default();
                let display_name = status.name.unwrap_or_else(|| name.clone());
                save_init(config, server, &key)?;
                eprintln!();
                print_success(server, &display_name, &agent_id);
                return Ok(());
            }
            "rejected" => {
                eprintln!("\n{} Request rejected by boss.", "❌".red());
                return Err("join request rejected".into());
            }
            _ => {
                // Still pending — show liveness dot every 10 polls
                if polls % 10 == 0 {
                    eprint!(".");
                }
            }
        }
    }
}

fn detect_name() -> String {
    // Try USER env var, fall back to hostname-like detection
    if let Ok(user) = std::env::var("USER") {
        if !user.is_empty() {
            return user;
        }
    }
    if let Ok(hostname) = std::env::var("HOSTNAME") {
        if !hostname.is_empty() {
            return hostname;
        }
    }
    "new-agent".to_string()
}

fn save_init(config: &mut Config, server: &str, key: &str) -> Result<(), Box<dyn Error>> {
    config.server = Some(server.to_string());
    config.key = Some(key.to_string());
    save_config(config)?;
    Ok(())
}

fn print_success(server: &str, name: &str, agent_id: &str) {
    let short_id = if agent_id.len() >= 8 { &agent_id[..8] } else { agent_id };
    eprintln!(
        "{} Initialized! Server: {}, Agent: {} ({})",
        "✅".green(),
        server,
        name.bold(),
        short_id
    );
    eprintln!("   Run {} to install Claude Code hooks.", "hiboss setup hooks".cyan());
}
```

Make sure:
- No unwrap() in production code
- Use colored crate (already in dependencies)
- File header comment present
- Functions ≤ 50 lines each
- Total file ≤ 150 lines
- Error messages are user-friendly
"""
