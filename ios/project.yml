name: HiBoss
options:
  bundleIdPrefix: ai.hiboss
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

configs:
  Debug: debug
  Release: release
  AdHoc: release

packages:
  HibossKit:
    path: ../HibossKit

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "23"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Automatic signing for every target and configuration; override with
    # `xcodebuild DEVELOPMENT_TEAM=<team>` to sign with another team.
    DEVELOPMENT_TEAM: JHH9GC8Y8C
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      APS_ENVIRONMENT: development
      CODE_SIGNING_ALLOWED: YES
    Release:
      APS_ENVIRONMENT: production
      CODE_SIGNING_ALLOWED: YES
    AdHoc:
      APS_ENVIRONMENT: production
      CODE_SIGNING_ALLOWED: YES

targets:
  HiBoss:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ShareCore
      - path: PushRelay
    dependencies:
      - package: HibossKit
      - target: HiBossWidgets
      - target: HiBossShare
      - target: NotificationService
    scheme:
      testTargets:
        - HiBossTests
        - HiBossUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hiboss.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/HiBoss.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

  HiBossWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: HibossKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hiboss.app.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  HiBossShare:
    type: app-extension
    platform: iOS
    sources:
      - path: HiBossShare
      - path: ShareCore
    dependencies:
      - package: HibossKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hiboss.app.share
        INFOPLIST_FILE: HiBossShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HiBossShare/HiBossShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: PushRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hiboss.app.NotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  HiBossTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../docs/fixtures/live-activity-end-state.json
        buildPhase: resources
        group: Fixtures
    dependencies:
      - target: HiBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hiboss.app.tests
        GENERATE_INFOPLIST_FILE: YES

  HiBossUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: HiBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hiboss.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HiBoss
