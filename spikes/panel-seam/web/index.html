<!--
  Offline entry document for the bundled panel renderer.
  Exports: the #root mount point.
  Dependencies: src/main.tsx and the restrictive inline content policy.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <title>HiBoss Panel Web Spike</title>
  </head>
  <body>
    <main id="root" aria-live="polite"></main>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
